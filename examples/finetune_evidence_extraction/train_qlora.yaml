### model
# Download Qwen2.5-3B-Instruct into ./models first, or use the Hugging Face ID.
model_name_or_path: ./models/Qwen2.5-3B-Instruct
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: industrial_fault_extraction_train
eval_dataset: industrial_fault_extraction_val
dataset_dir: data
template: qwen
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: saves/qwen2.5-3b-evidence-lora
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
